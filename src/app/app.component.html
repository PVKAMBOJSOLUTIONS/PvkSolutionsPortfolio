<a class="skip-link" href="#main-content">Skip to content</a>
<app-navbar></app-navbar>

<!-- Main content area - Changes based on route -->
<main id="main-content" class="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<!-- Footer - Always visible at bottom -->
<app-footer></app-footer>

<!-- Route transition sheet -->
<div class="page-curtain" [class.is-covering]="covering" [class.is-revealing]="revealing" [class.is-intro]="intro" [style.--intro-elapsed]="introElapsed" aria-hidden="true">
  <div class="curve curve-top"></div>
  <p class="curtain-label">{{ curtainLabel }}</p>
  <div class="curve curve-bottom"></div>
</div>
