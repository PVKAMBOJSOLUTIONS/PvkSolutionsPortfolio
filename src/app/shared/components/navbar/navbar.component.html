<nav class="navbar" aria-label="Main navigation">
  <div class="nav-container">
    <a class="logo" routerLink="/" (click)="closeMobileMenu()">Pratham Kamboj<span aria-hidden="true">.</span></a>
    <!-- Desktop Navigation -->
    <div class="nav-links desktop-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
      <a routerLink="/projects" routerLinkActive="active" ariaCurrentWhenActive="page">Projects</a>
      <a routerLink="/skills" routerLinkActive="active" ariaCurrentWhenActive="page">Skills</a>
      <a routerLink="/experience" routerLinkActive="active" ariaCurrentWhenActive="page">Experience</a>
      <a routerLink="/hobbies" routerLinkActive="active" ariaCurrentWhenActive="page">Interests</a>
      <a routerLink="/contact" routerLinkActive="active" ariaCurrentWhenActive="page">Contact</a>
    </div>
    <!-- Mobile Menu Button -->
    <button #menuButton type="button" class="mobile-menu-btn" (click)="toggleMobileMenu()"
      aria-controls="mobile-navigation" [attr.aria-expanded]="isMobileMenuOpen"
      [attr.aria-label]="isMobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'">
      {{ isMobileMenuOpen ? 'Close' : 'Menu' }}
    </button>
  </div>
  <!-- Mobile Navigation -->
  <div id="mobile-navigation" class="mobile-nav" [class.active]="isMobileMenuOpen"
    [attr.inert]="isMobileMenuOpen ? null : ''" [attr.aria-hidden]="!isMobileMenuOpen">
    <a routerLink="/" (click)="closeMobileMenu()" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">Home</a>
    <a routerLink="/projects" (click)="closeMobileMenu()" routerLinkActive="active" ariaCurrentWhenActive="page">Projects</a>
    <a routerLink="/skills" (click)="closeMobileMenu()" routerLinkActive="active" ariaCurrentWhenActive="page">Skills</a>
    <a routerLink="/experience" (click)="closeMobileMenu()" routerLinkActive="active" ariaCurrentWhenActive="page">Experience</a>
    <a routerLink="/hobbies" (click)="closeMobileMenu()" routerLinkActive="active" ariaCurrentWhenActive="page">Interests</a>
    <a routerLink="/contact" (click)="closeMobileMenu()" routerLinkActive="active" ariaCurrentWhenActive="page">Contact</a>
  </div>
</nav>
