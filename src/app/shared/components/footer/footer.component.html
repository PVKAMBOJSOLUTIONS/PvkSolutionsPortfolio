<footer class="footer">
  <div class="footer-container">
    <!-- Footer Top Section -->
    <div class="footer-top">
      <div class="footer-brand"><h3>Pratham Kamboj.</h3><p>Software Engineer<br>Mohali, India</p></div>
      <div class="footer-links">
        <div class="link-group">
          <h4>Explore</h4>
          <ul>@for (link of quickLinks; track link.route) {<li><a [routerLink]="'/' + link.route">{{ link.label }}</a></li>}</ul>
        </div>
        <div class="link-group">
          <h4>Elsewhere</h4>
          <div class="social-links">
            @for (social of socialLinks; track social.name) {
              <a [href]="social.url" [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'" rel="noopener noreferrer">{{ social.name }}</a>
            }
          </div>
        </div>
      </div>
    </div>
    <!-- Footer Bottom Section -->
    <div class="footer-bottom">
      <p>&copy; {{ currentYear }} Pratham Kamboj</p>
      <a routerLink="/privacy">Privacy policy</a>
      <a routerLink="/terms">Terms of service</a>
      <button class="scroll-top" (click)="scrollToTop()">Back to top</button>
    </div>
  </div>
</footer>
