<footer class="footer">
  <div class="footer-container">
    <!-- Footer Top Section -->
    <div class="footer-top">
      <div class="footer-brand">
        <h3 class="brand-name">Pratham Kamboj</h3>
        <p class="brand-tagline">Software Engineer</p>
      </div>

      <div class="footer-links">
        <div class="link-group">
          <h4>Quick Links</h4>
          <ul>
            @for (link of quickLinks; track link) {
              <li>
                <a (click)="navigateTo(link.route)">{{ link.label }}</a>
              </li>
            }
          </ul>
        </div>

        <div class="link-group">
          <h4>Connect</h4>
          <div class="social-links">
            @for (social of socialLinks; track social) {
              <a
                [href]="social.url"
                [attr.target]="social.url.startsWith('mailto:') ? null : '_blank'"
                rel="noopener noreferrer"
                [title]="social.name"
                [attr.aria-label]="social.name"
                class="social-link">
                @if (social.icon === 'linkedin') {
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                  </svg>
                }
                @if (social.icon === 'email') {
                  <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M0 3v18h24v-18h-24zm6.623 7.929l-4.623 5.712v-9.458l4.623 3.746zm-4.141-5.929h19.035l-9.517 7.713-9.518-7.713zm5.694 7.188l3.824 3.099 3.83-3.104 5.612 6.817h-18.779l5.513-6.812zm9.208-1.264l4.616-3.741v9.348l-4.616-5.607z"/>
                  </svg>
                }
              </a>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Footer Bottom Section -->
    <div class="footer-bottom">
      <button class="scroll-top" (click)="scrollToTop()" title="Back to top">
        ↑
      </button>
    </div>
  </div>
</footer>
