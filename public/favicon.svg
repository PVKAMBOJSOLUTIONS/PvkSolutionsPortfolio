<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ribbon" x1="18" y1="30" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9DBCF0"/>
      <stop offset="0.48" stop-color="#6F91C8"/>
      <stop offset="1" stop-color="#AFC8F2"/>
    </linearGradient>

    <linearGradient id="fold" x1="20" y1="20" x2="40" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFD5F7"/>
      <stop offset="1" stop-color="#536B91"/>
    </linearGradient>

    <radialGradient id="orb" cx="30%" cy="25%" r="78%">
      <stop offset="0" stop-color="#62E8FF"/>
      <stop offset="0.42" stop-color="#168DFF"/>
      <stop offset="0.78" stop-color="#3947FF"/>
      <stop offset="1" stop-color="#A62BFF"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="2.2"
                    flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Standalone transparent icon -->
  <g filter="url(#softShadow)">
    <!-- Main continuous P-like ribbon -->
    <path
      d="M18 25
         C18 20 21.5 17 26.5 17
         H57
         C72 17 82 25.5 82 39
         V63
         C82 73 76 82 66 84
         C62 85 58 82 58 78
         C58 74 61 72 65 71
         C69 70 71 67 71 62
         V40
         C71 34 66.5 30 60 30
         H38
         L43 35
         C45 37 45 40 43 42
         L37 48
         C35 50 32 50 30 48
         L20.5 38.5
         C18.8 36.8 18 34.5 18 32
         V25Z"
      fill="url(#ribbon)"
    />

    <!-- Folded vertical stroke -->
    <path
      d="M18 32
         L30.5 44.5
         C33 47 36.5 47 39 44.5
         L43 40.5
         L34 31.5
         L25 22.5
         C22 19.5 18 21.5 18 25V32Z"
      fill="url(#fold)"
      opacity=".82"
    />

    <!-- Colored dot in the negative space -->
    <circle cx="58" cy="50" r="8.2" fill="url(#orb)"/>

    <!-- Subtle orb highlight -->
    <circle cx="55.5" cy="47.5" r="2.2" fill="#DDFBFF" opacity=".32"/>
  </g>
</svg>
